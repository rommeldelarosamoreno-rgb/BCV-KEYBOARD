name: Compilar Teclado APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Dar permisos de ejecución y compilar APK
      run: |
        chmod +x gradlew || echo "Gradlew se generará"
        # Aquí compilaremos el proyecto de Android automáticamente
        echo "Preparando compilación en la nube..."
