name: Compilar Teclado APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Gradle y Compilar APK
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper
        ./gradlew assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: bcv-keyboard-apk
        path: app/build/outputs/apk/debug/app-debug.apk
